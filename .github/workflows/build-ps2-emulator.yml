name: Build self-hosted Play! emulator

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ps2-emulator.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ChangedGames
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.1

      - name: Check out Play! source
        run: git clone --recurse-submodules https://github.com/jpd002/Play-.git play-source

      - name: Build Play! WebAssembly core
        working-directory: play-source
        run: |
          emcmake cmake --preset wasm-ninja
          cmake --build --preset wasm-ninja-release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17

      - name: Run Play! code generation tests
        working-directory: play-source/deps/CodeGen/js
        run: |
          npm install
          npx tsc
          cd "$GITHUB_WORKSPACE/play-source/build_cmake/build/wasm-ninja/Source/ui_js/Source/CodeGen/Release"
          node "$GITHUB_WORKSPACE/play-source/deps/CodeGen/js/out/index.js"

      - name: Build Play! browser app
        working-directory: play-source/js/play_browser
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/play-source/build_cmake/build/wasm-ninja/Source/ui_js/Release"
          cp "$BUILD_DIR/Play.js" ./src/
          cp "$BUILD_DIR/Play.wasm" ./public/
          cp "$BUILD_DIR/Play.js" ./public/
          export REACT_APP_VERSION="$(git -C "$GITHUB_WORKSPACE/play-source" describe --always)"
          npm install
          PUBLIC_URL=. npm run build

      - name: Copy self-hosted player into website
        run: |
          rm -rf emulator
          mkdir -p emulator
          cp -R play-source/js/play_browser/build/. emulator/
          cp play-source/License.txt emulator/PLAY-LICENSE.txt
          printf 'Built from https://github.com/jpd002/Play-\n' > emulator/BUILD-SOURCE.txt

      - name: Commit generated emulator files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f emulator
          if git diff --cached --quiet; then
            echo "No emulator output changes to commit."
          else
            git commit -m "Build and vendor self-hosted Play! emulator"
            git push
          fi
